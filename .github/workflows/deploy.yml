# Deploy the demo to Azure Container Apps.
#
# Flow:  push a version tag (or run manually)  →  build the image (React + Flask, one
#        multi-stage Dockerfile)  →  push to GHCR  →  point the Container App at it.
#
# The vulnerabilities in this app are intentional; GitHub does NOT scan them here. The
# client's own tool scans the DEPLOYED app at its public URL. See DEPLOYMENT.md.
#
# One-time setup before the first deploy (DEPLOYMENT.md): provision infra/ (Bicep),
# create the Azure OIDC federated credential, and set these repository *Variables*:
#   AZURE_CLIENT_ID  AZURE_TENANT_ID  AZURE_SUBSCRIPTION_ID
#   AZURE_RESOURCE_GROUP  CONTAINERAPP_NAME
# No secrets are stored: Azure auth is OIDC; the GHCR push uses the built-in GITHUB_TOKEN.

name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build and deploy (default: short commit SHA)"
        required: false
        type: string

permissions:
  contents: read
  packages: write        # push the image to GHCR
  id-token: write        # Azure OIDC — no stored secrets

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag + lowercase image name
        id: img
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="sha-$(git rev-parse --short HEAD)"
          fi
          # GHCR requires a lowercase image path.
          repo_lc="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=$tag"                          >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo_lc}"          >> "$GITHUB_OUTPUT"
          echo "Deploying ghcr.io/${repo_lc}:${tag}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.image }}:latest

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.img.outputs.image }}:${{ steps.img.outputs.tag }}" \
            --set-env-vars "IMAGE_TAG=${{ steps.img.outputs.tag }}" \
            --output none

      - name: Health check the new revision
        run: |
          fqdn="$(az containerapp show \
            --name "${{ vars.CONTAINERAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)"
          url="https://${fqdn}"
          echo "App URL: ${url}"
          echo "### Deployed \`${{ steps.img.outputs.tag }}\` → ${url}" >> "$GITHUB_STEP_SUMMARY"
          # A fresh revision takes a moment to answer; retry before failing the run.
          for attempt in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "${url}/healthz" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "healthz OK after ${attempt} attempt(s)"; exit 0
            fi
            echo "  not ready (HTTP ${code}), attempt ${attempt}/20"; sleep 6
          done
          echo "::error::/healthz never returned 200 — deploy unhealthy"; exit 1
